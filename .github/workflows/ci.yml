name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build library and examples
        id: build
        run: npm run build:examples

      - name: Check types
        id: types
        run: npm run typecheck

      - name: Run tests
        id: tests
        run: npm test

      - name: Publish CI summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TYPES_RESULT: ${{ steps.types.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # CI results

          | Check | Result |
          | --- | --- |
          | Build library and examples | $BUILD_RESULT |
          | Type checks | $TYPES_RESULT |
          | Tests | $TESTS_RESULT |
          EOF
