name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build library and examples
        run: npm run build:examples

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify benchmark scenarios
        run: npm run bench -- --samples 1 --operations 3 --idle-ms 250 --server-calls 8 --out benchmark-results/ci

      - name: Save benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-smoke
          path: benchmark-results/ci
          retention-days: 7
          if-no-files-found: ignore
