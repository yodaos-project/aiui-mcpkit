<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title description">
  <title id="title">AIUI MCPKit</title>
  <desc id="description">Build an AIUI agent into an MCP server and an interactive Apps View with Ink WebAssembly.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1915"/>
      <stop offset="1" stop-color="#07110F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(938 144) rotate(90) scale(260 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#41FF8A" stop-opacity=".12"/>
      <stop offset="1" stop-color="#41FF8A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#75B89C" fill-opacity=".12"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="1198" height="298" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect x="640" width="560" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="48" y="56" fill="#8BB9A4" font-size="12" font-weight="600" letter-spacing="2">JAVASCRIPT / TYPESCRIPT / WEBASSEMBLY</text>
      <rect x="48" y="88" width="58" height="58" rx="15" fill="#132B21" stroke="#345B47"/>
      <path d="M69 105 59 117 69 129M85 105 95 117 85 129M80 102 74 132" stroke="#70FFAB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="136" fill="#EDFFF4" font-size="56" font-weight="700" letter-spacing="-2">AIUI MCPKit</text>
      <text x="48" y="187" fill="#AACBBB" font-size="21">AIUI agents → interactive MCP Apps</text>
    </g>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13">
      <rect x="48" y="224" width="118" height="30" rx="7" fill="#13271F" stroke="#294838"/>
      <text x="107" y="244" text-anchor="middle" fill="#B7D8C7">.ink pages</text>
      <path d="M179 239H203M198 234 203 239 198 244" stroke="#5C8D73" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="216" y="224" width="146" height="30" rx="7" fill="#13271F" stroke="#294838"/>
      <text x="289" y="244" text-anchor="middle" fill="#B7D8C7">buildPlugin()</text>
      <path d="M375 239H399M394 234 399 239 394 244" stroke="#5C8D73" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="412" y="244" fill="#70FFAB">MCP Apps</text>
    </g>
    <path d="M685 150H731M731 150V91H780M731 150V209H780" stroke="#37654D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="685" cy="150" r="6" fill="#70FFAB"/>
    <circle cx="731" cy="150" r="4" fill="#70FFAB"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="780" y="50" width="368" height="82" rx="13" fill="#10231B" stroke="#31563F"/>
      <rect x="802" y="73" width="36" height="36" rx="9" fill="#1B3828"/>
      <path d="M812 84H828M812 91H824M812 98H828" stroke="#70FFAB" stroke-width="2" stroke-linecap="round"/>
      <text x="856" y="86" fill="#E2F8EB" font-size="16" font-weight="600">MCP SERVER</text>
      <text x="856" y="109" fill="#96B9A4" font-size="14">Validated tools + structured results</text>
      <rect x="780" y="168" width="368" height="82" rx="13" fill="#10231B" stroke="#31563F"/>
      <rect x="802" y="191" width="36" height="36" rx="9" fill="#1B3828"/>
      <rect x="811" y="201" width="18" height="16" rx="2" stroke="#70FFAB" stroke-width="1.7"/>
      <path d="M811 206H829" stroke="#70FFAB" stroke-width="1.7"/>
      <text x="856" y="204" fill="#E2F8EB" font-size="16" font-weight="600">INTERACTIVE VIEW</text>
      <text x="856" y="227" fill="#96B9A4" font-size="14">Your UI + Ink WebAssembly</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="20.5" stroke="#294536"/>
</svg>
